<!DOCTYPE html>
<html>
    <head>
        <title>Nested Lists</title>
    </head>
    <body>
        <ol>
            <li>One</li>
            <li>Two</li>
            <li>Three</li>
            <ul>
                <li>Three and a quarter</li>
                <li>Three and a half</li>
                <li>Three and three quarters</li>
            </ul>
            <li>Four</li>
            <li>Five</li>
        </ol>
    </body>
</html>
